openapi: 3.0.3
info:
  title: Orders API
  description: A small reference specification used to exercise the semantic lint gate.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server.
security:
  - bearerAuth: []
tags:
  - name: orders
    description: Operations for creating and inspecting customer orders.
paths:
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders
      description: Returns a paginated list of orders visible to the caller.
      parameters:
        - name: pageSize
          in: query
          description: Maximum number of orders to return in a single page.
          required: false
          schema:
            type: integer
            description: Page size requested by the client.
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          description: One-based index of the page to return.
          required: false
          schema:
            type: integer
            description: Page number to return.
            minimum: 1
            maximum: 10000
            default: 1
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          description: The pagination parameters were invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request was not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not list orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order
      description: Creates a new order for the authenticated customer.
      requestBody:
        description: The order to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: The order was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: The order payload was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request was not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not create orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get an order
      description: Returns a single order by its identifier.
      parameters:
        - name: orderId
          in: path
          description: Identifier of the order to return.
          required: true
          schema:
            type: string
            description: UUID of the order.
            format: uuid
            minLength: 36
            maxLength: 36
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: The request was not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not read this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No order exists with that identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Cancels an order that has not yet shipped.
      parameters:
        - name: orderId
          in: path
          description: Identifier of the order to cancel.
          required: true
          schema:
            type: string
            description: UUID of the order.
            format: uuid
            minLength: 36
            maxLength: 36
      responses:
        "204":
          description: The order was cancelled.
        "401":
          description: The request was not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not cancel this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No order exists with that identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token issued by the identity provider.
  schemas:
    Order:
      type: object
      description: A customer order.
      required: [orderId, status, totalMinorUnits, currencyCode, createdAt]
      properties:
        orderId:
          type: string
          description: Unique identifier of the order.
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          type: string
          description: Current lifecycle state of the order.
          enum: [PENDING, CONFIRMED, SHIPPED, CANCELLED]
        totalMinorUnits:
          type: integer
          description: Order total expressed in the minor units of the currency.
          minimum: 0
          maximum: 2147483647
        currencyCode:
          type: string
          description: ISO 4217 currency code for the order total.
          minLength: 3
          maxLength: 3
        createdAt:
          type: string
          description: Timestamp at which the order was created.
          format: date-time
          minLength: 20
          maxLength: 30
    OrderCreate:
      type: object
      description: Payload used to create an order.
      required: [currencyCode, totalMinorUnits]
      properties:
        currencyCode:
          type: string
          description: ISO 4217 currency code for the order total.
          minLength: 3
          maxLength: 3
        totalMinorUnits:
          type: integer
          description: Order total expressed in the minor units of the currency.
          minimum: 0
          maximum: 2147483647
    OrderPage:
      type: object
      description: A single page of orders.
      required: [items, totalCount]
      properties:
        items:
          type: array
          description: The orders in this page.
          items:
            $ref: "#/components/schemas/Order"
        totalCount:
          type: integer
          description: Total number of orders matching the query.
          minimum: 0
          maximum: 2147483647
    Error:
      type: object
      description: A machine-readable error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          minLength: 1
          maxLength: 100
        message:
          type: string
          description: Human-readable explanation of the error.
          minLength: 1
          maxLength: 255
