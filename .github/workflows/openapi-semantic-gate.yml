name: OpenAPI semantic lint gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.yaml"
      - "**.yml"
      - "**.json"

# One review per pull request; a new push cancels the in-flight run.
concurrency:
  group: openapi-semantic-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-lint:
    name: Semantic lint
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # In consuming repositories replace this with:
      #   uses: apiglue/api-semantinc-linting@v1
      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fail-on: errors
